<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #131316;
  --card: #1c1c20;
  --display-muted: #9a97a3;
  --display-main: #f1eef7;
  --num-bg: #2b2b30;
  --num-bg-hover: #38383e;
  --func-bg: #38383e;
  --func-bg-hover: #45454c;
  --func-text: #cfc6ff;
  --op-bg: #2b2b30;
  --op-text: #c9b6ff;
  --op-bg-hover: #38383e;
  --equals-bg: #c9b6ff;
  --equals-text: #211a2e;
  --sci-bg: #232327;
  --sci-text: #a6e3d4;
  --border: #2c2c32;
  --shadow: rgba(0, 0, 0, 0.4);
}

body[data-theme="light"] {
  --bg: #eef0f4;
  --card: #ffffff;
  --display-muted: #767680;
  --display-main: #1c1b1f;
  --num-bg: #f2f1f6;
  --num-bg-hover: #e4e2ec;
  --func-bg: #e6e1f5;
  --func-bg-hover: #d9d2f0;
  --func-text: #4d3e8f;
  --op-bg: #f2f1f6;
  --op-text: #6b4fbb;
  --op-bg-hover: #e4e2ec;
  --equals-bg: #6b4fbb;
  --equals-text: #ffffff;
  --sci-bg: #e3f4ee;
  --sci-text: #1e7e63;
  --border: #e2e0ea;
  --shadow: rgba(80, 70, 110, 0.18);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  font-family: "Roboto", "Segoe UI", sans-serif;
  transition: background 0.2s ease;
}

.calc {
  width: 360px;
  max-width: 94vw;
  background: var(--card);
  border-radius: 28px;
  padding: 16px 16px 20px;
  box-shadow: 0 24px 60px var(--shadow);
  position: relative;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--display-muted);
  font-size: 16px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
}

.icon-btn:hover {
  background: var(--func-bg);
}

.icon-btn.text-btn {
  width: auto;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.memory-indicator {
  margin-left: auto;
  font-size: 12px;
  font-weight: 700;
  color: var(--op-text);
  opacity: 0;
  transition: opacity 0.15s ease;
}

.memory-indicator.active {
  opacity: 1;
}

.history-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
  border-radius: 16px;
  background: var(--num-bg);
  margin-bottom: 0;
}

.history-panel.open {
  max-height: 220px;
  margin-bottom: 10px;
  overflow-y: auto;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px 4px;
  font-size: 12px;
  color: var(--display-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.history-header button {
  border: none;
  background: none;
  color: var(--op-text);
  font-size: 12px;
  cursor: pointer;
  font-weight: 700;
}

.history-panel ul {
  list-style: none;
  margin: 0;
  padding: 0 14px 10px;
}

.history-panel li {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  color: var(--display-main);
}

.history-panel li:last-child {
  border-bottom: none;
}

.history-expr {
  display: block;
  font-size: 12px;
  color: var(--display-muted);
}

.history-result {
  display: block;
  font-size: 18px;
  font-weight: 500;
}

.history-empty {
  text-align: center;
  font-size: 12px;
  color: var(--display-muted);
  padding: 12px 0;
  margin: 0;
}

.display {
  text-align: right;
  padding: 18px 10px 14px;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.expression {
  font-size: 15px;
  color: var(--display-muted);
  min-height: 20px;
  overflow-x: auto;
  white-space: nowrap;
}

.result {
  font-size: 42px;
  font-weight: 500;
  color: var(--display-main);
  overflow-x: auto;
  white-space: nowrap;
  line-height: 1.2;
}

.mem-row,
.sci-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}

.sci-row {
  grid-template-columns: repeat(5, 1fr);
  max-height: 0;
  overflow: hidden;
  margin-bottom: 0;
  opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
}

.sci-row.open {
  max-height: 200px;
  opacity: 1;
  margin-bottom: 8px;
}

.pad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.key {
  border: none;
  border-radius: 18px;
  height: 60px;
  font-size: 20px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  color: var(--display-main);
  transition: filter 0.12s ease, transform 0.06s ease;
}

.key:active {
  transform: scale(0.94);
}

.key-small {
  height: 40px;
  font-size: 13px;
  font-weight: 700;
}

.key-num {
  background: var(--num-bg);
}
.key-num:hover {
  background: var(--num-bg-hover);
}

.key-func {
  background: var(--func-bg);
  color: var(--func-text);
  font-size: 18px;
}
.key-func:hover {
  background: var(--func-bg-hover);
}

.key-op {
  background: var(--op-bg);
  color: var(--op-text);
  font-size: 22px;
}
.key-op:hover {
  background: var(--op-bg-hover);
}

.key-sci {
  background: var(--sci-bg);
  color: var(--sci-text);
  height: 46px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
}

.key-equals {
  background: var(--equals-bg);
  color: var(--equals-text);
  font-size: 24px;
}

.mode-footer {
  text-align: center;
  margin-top: 12px;
}

.mode-toggle {
  border: none;
  background: none;
  color: var(--op-text);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 6px 10px;
}

.credit {
  margin: 2px 0 0;
  font-size: 11px;
  color: var(--display-muted);
  letter-spacing: 0.02em;
}

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--equals-bg);
  color: var(--equals-text);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 380px) {
  .result { font-size: 34px; }
  .key { height: 52px; font-size: 18px; }
}

</style>
</head>
<body>

<main class="calc" id="calc">

  <header class="topbar">
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    <button class="icon-btn text-btn" id="degToggle" title="Degrees / Radians">DEG</button>
    <div class="memory-indicator" id="memoryIndicator">M</div>
    <button class="icon-btn" id="historyToggle" title="History">🕘</button>
    <button class="icon-btn" id="copyBtn" title="Copy result">⧉</button>
  </header>

  <section class="history-panel" id="historyPanel">
    <div class="history-header">
      <span>History</span>
      <button id="clearHistory">Clear</button>
    </div>
    <ul id="historyList"></ul>
    <p class="history-empty" id="historyEmpty">No calculations yet</p>
  </section>

  <section class="display">
    <div class="expression" id="expressionLine">&nbsp;</div>
    <div class="result" id="resultLine">0</div>
  </section>

  <section class="mem-row">
    <button class="key key-func key-small" data-mem="MC">MC</button>
    <button class="key key-func key-small" data-mem="MR">MR</button>
    <button class="key key-func key-small" data-mem="M+">M+</button>
    <button class="key key-func key-small" data-mem="M-">M−</button>
  </section>

  <section class="sci-row" id="sciRow">
    <button class="key key-sci" data-insert="(">(</button>
    <button class="key key-sci" data-insert=")">)</button>
    <button class="key key-sci" data-insert="sin(">sin</button>
    <button class="key key-sci" data-insert="cos(">cos</button>
    <button class="key key-sci" data-insert="tan(">tan</button>

    <button class="key key-sci" data-insert="log(">log</button>
    <button class="key key-sci" data-insert="ln(">ln</button>
    <button class="key key-sci" data-insert="√(">√</button>
    <button class="key key-sci" data-append="^2">x²</button>
    <button class="key key-sci" data-append="^">x^y</button>

    <button class="key key-sci" data-insert="π">π</button>
    <button class="key key-sci" data-insert="e">e</button>
    <button class="key key-sci" data-append="!">n!</button>
    <button class="key key-sci" data-append="^(-1)">1/x</button>
    <button class="key key-sci" data-insert="×10^(">EXP</button>
  </section>

  <section class="pad">
    <button class="key key-func" id="allClear">AC</button>
    <button class="key key-func" id="backspace">⌫</button>
    <button class="key key-func" data-append="%">%</button>
    <button class="key key-op" data-insert="÷">÷</button>

    <button class="key key-num" data-digit="7">7</button>
    <button class="key key-num" data-digit="8">8</button>
    <button class="key key-num" data-digit="9">9</button>
    <button class="key key-op" data-insert="×">×</button>

    <button class="key key-num" data-digit="4">4</button>
    <button class="key key-num" data-digit="5">5</button>
    <button class="key key-num" data-digit="6">6</button>
    <button class="key key-op" data-insert="−">−</button>

    <button class="key key-num" data-digit="1">1</button>
    <button class="key key-num" data-digit="2">2</button>
    <button class="key key-num" data-digit="3">3</button>
    <button class="key key-op" data-insert="+">+</button>

    <button class="key key-func" id="toggleSign">±</button>
    <button class="key key-num" data-digit="0">0</button>
    <button class="key key-num" data-digit=".">.</button>
    <button class="key key-equals" id="equals">=</button>
  </section>

  <footer class="mode-footer">
    <button class="mode-toggle" id="sciToggle">Scientific mode</button>
    <p class="credit">Made by Aqib Rizwan</p>
  </footer>

</main>

<div class="toast" id="toast"></div>

<script>
/* =======================================================
   Expression evaluator (tokenizer + recursive-descent parser)
   ======================================================= */

function tokenize(expr) {
  const tokens = [];
  const funcs = ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'log', 'ln', 'sqrt'];
  let i = 0;
  while (i < expr.length) {
    const ch = expr[i];
    if (ch === ' ') { i++; continue; }

    if (/[0-9.]/.test(ch)) {
      let num = ch; i++;
      while (i < expr.length && /[0-9.]/.test(expr[i])) { num += expr[i]; i++; }
      tokens.push({ type: 'num', value: parseFloat(num) });
      continue;
    }

    if (/[a-zA-Z]/.test(ch)) {
      let name = ch; i++;
      while (i < expr.length && /[a-zA-Z]/.test(expr[i])) { name += expr[i]; i++; }
      if (name === 'pi') tokens.push({ type: 'num', value: Math.PI });
      else if (name === 'e') tokens.push({ type: 'num', value: Math.E });
      else if (funcs.includes(name)) tokens.push({ type: 'func', value: name });
      else throw new Error('Unknown token: ' + name);
      continue;
    }

    if (ch === '×') { tokens.push({ type: 'op', value: '*' }); i++; continue; }
    if (ch === '÷') { tokens.push({ type: 'op', value: '/' }); i++; continue; }
    if (ch === '−') { tokens.push({ type: 'op', value: '-' }); i++; continue; }
    if (ch === '√') { tokens.push({ type: 'func', value: 'sqrt' }); i++; continue; }
    if (ch === 'π') { tokens.push({ type: 'num', value: Math.PI }); i++; continue; }

    if ('+-*/^!%()'.includes(ch)) {
      tokens.push({ type: 'op', value: ch });
      i++;
      continue;
    }

    throw new Error('Unexpected character: ' + ch);
  }
  return tokens;
}

function parseExpression(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const isOp = (v) => peek() && peek().type === 'op' && peek().value === v;

  function parseExpr() {
    let node = parseTerm();
    while (isOp('+') || isOp('-')) {
      const op = next().value;
      node = { type: 'binop', op, left: node, right: parseTerm() };
    }
    return node;
  }

  function parseTerm() {
    let node = parseFactor();
    while (isOp('*') || isOp('/')) {
      const op = next().value;
      node = { type: 'binop', op, left: node, right: parseFactor() };
    }
    return node;
  }

  function parseFactor() {
    let node = parseUnary();
    if (isOp('^')) {
      next();
      node = { type: 'binop', op: '^', left: node, right: parseFactor() };
    }
    return node;
  }

  function parseUnary() {
    if (isOp('-')) { next(); return { type: 'unary', op: '-', operand: parseUnary() }; }
    if (isOp('+')) { next(); return parseUnary(); }
    return parsePostfix();
  }

  function parsePostfix() {
    let node = parsePrimary();
    while (isOp('!') || isOp('%')) {
      const op = next().value;
      node = { type: 'postfix', op, operand: node };
    }
    return node;
  }

  function parsePrimary() {
    const tok = peek();
    if (!tok) throw new Error('Unexpected end of expression');

    if (tok.type === 'num') { next(); return { type: 'num', value: tok.value }; }

    if (tok.type === 'func') {
      next();
      if (!isOp('(')) throw new Error('Expected ( after function');
      next();
      const arg = parseExpr();
      if (!isOp(')')) throw new Error('Expected )');
      next();
      return { type: 'call', name: tok.value, arg };
    }

    if (isOp('(')) {
      next();
      const node = parseExpr();
      if (!isOp(')')) throw new Error('Expected )');
      next();
      return node;
    }

    throw new Error('Unexpected token');
  }

  const result = parseExpr();
  if (pos !== tokens.length) throw new Error('Unexpected trailing input');
  return result;
}

function factorial(n) {
  if (n < 0 || Math.floor(n) !== n) throw new Error('Factorial needs a non-negative integer');
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function evalNode(node, isDeg) {
  switch (node.type) {
    case 'num': return node.value;
    case 'unary': return -evalNode(node.operand, isDeg);
    case 'postfix': {
      const v = evalNode(node.operand, isDeg);
      if (node.op === '!') return factorial(v);
      if (node.op === '%') return v / 100;
      break;
    }
    case 'binop': {
      const l = evalNode(node.left, isDeg);
      const r = evalNode(node.right, isDeg);
      switch (node.op) {
        case '+': return l + r;
        case '-': return l - r;
        case '*': return l * r;
        case '/': return l / r;
        case '^': return Math.pow(l, r);
      }
      break;
    }
    case 'call': {
      const arg = evalNode(node.arg, isDeg);
      const rad = isDeg ? (arg * Math.PI) / 180 : arg;
      switch (node.name) {
        case 'sin': return Math.sin(rad);
        case 'cos': return Math.cos(rad);
        case 'tan': return Math.tan(rad);
        case 'asin': { const v = Math.asin(arg); return isDeg ? (v * 180) / Math.PI : v; }
        case 'acos': { const v = Math.acos(arg); return isDeg ? (v * 180) / Math.PI : v; }
        case 'atan': { const v = Math.atan(arg); return isDeg ? (v * 180) / Math.PI : v; }
        case 'log': return Math.log10(arg);
        case 'ln': return Math.log(arg);
        case 'sqrt': return Math.sqrt(arg);
      }
      break;
    }
  }
  throw new Error('Could not evaluate');
}

function autoBalance(expr) {
  let open = 0;
  for (const ch of expr) {
    if (ch === '(') open++;
    if (ch === ')') open--;
  }
  return open > 0 ? expr + ')'.repeat(open) : expr;
}

function evaluateExpression(expr, isDeg) {
  const balanced = autoBalance(expr);
  const tokens = tokenize(balanced);
  const ast = parseExpression(tokens);
  const result = evalNode(ast, isDeg);
  if (!isFinite(result)) throw new Error('Math error');
  return result;
}

function formatNumber(num) {
  if (Object.is(num, -0)) num = 0;
  const rounded = Math.round((num + Number.EPSILON) * 1e10) / 1e10;
  if (Math.abs(rounded) > 1e12 || (Math.abs(rounded) < 1e-9 && rounded !== 0)) {
    return rounded.toExponential(6).replace(/\.?0+e/, 'e');
  }
  const str = String(rounded);
  if (str.length > 14) return rounded.toPrecision(10).replace(/\.?0+$/, '');
  return str;
}

/* =======================================================
   UI wiring
   ======================================================= */

const expressionLine = document.getElementById('expressionLine');
const resultLine = document.getElementById('resultLine');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const historyEmpty = document.getElementById('historyEmpty');
const sciRow = document.getElementById('sciRow');
const sciToggle = document.getElementById('sciToggle');
const degToggle = document.getElementById('degToggle');
const themeToggle = document.getElementById('themeToggle');
const memoryIndicator = document.getElementById('memoryIndicator');
const toast = document.getElementById('toast');

let expr = '';
let justEvaluated = false;
let isDeg = true;
let memoryValue = 0;
let history = [];

function render() {
  expressionLine.textContent = expr || '\u00A0';
  if (!expr) {
    resultLine.textContent = '0';
    return;
  }
  try {
    const val = evaluateExpression(expr, isDeg);
    resultLine.textContent = formatNumber(val);
  } catch (e) {
    resultLine.textContent = justEvaluated ? resultLine.textContent : '…';
  }
}

function insertText(text) {
  if (justEvaluated) {
    // start fresh unless the inserted text is an operator (continue from result)
    const startsWithOp = /^[+\-−×÷^]/.test(text);
    expr = startsWithOp ? resultLine.textContent + text : text;
    justEvaluated = false;
  } else {
    expr += text;
  }
  render();
}

function appendAfterCurrent(text) {
  justEvaluated = false;
  expr += text;
  render();
}

function backspace() {
  justEvaluated = false;
  expr = expr.slice(0, -1);
  render();
}

function clearAll() {
  expr = '';
  justEvaluated = false;
  render();
}

function toggleSign() {
  const m = expr.match(/(\d*\.?\d+)$/);
  if (!m) {
    expr += expr === '' ? '-' : '';
    render();
    return;
  }
  const numStr = m[0];
  const idx = expr.length - numStr.length;
  if (idx > 0 && expr[idx - 1] === '-') {
    const prevPrev = idx - 2 >= 0 ? expr[idx - 2] : null;
    const unaryContext = idx - 1 === 0 || (prevPrev && '+-−×÷^('.includes(prevPrev));
    if (unaryContext) {
      expr = expr.slice(0, idx - 1) + expr.slice(idx);
      render();
      return;
    }
  }
  expr = expr.slice(0, idx) + '-' + expr.slice(idx);
  render();
}

function equals() {
  if (!expr) return;
  try {
    const val = evaluateExpression(expr, isDeg);
    const formatted = formatNumber(val);
    pushHistory(expr, formatted);
    expr = formatted;
    resultLine.textContent = formatted;
    expressionLine.textContent = '\u00A0';
    justEvaluated = true;
  } catch (e) {
    resultLine.textContent = 'Error';
    justEvaluated = true;
    expr = '';
  }
}

/* ---------- History ---------- */

function pushHistory(sourceExpr, result) {
  history.unshift({ expr: sourceExpr, result });
  if (history.length > 50) history.pop();
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = '';
  historyEmpty.style.display = history.length ? 'none' : 'block';
  history.forEach((item) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="history-expr">${item.expr}</span><span class="history-result">${item.result}</span>`;
    li.addEventListener('click', () => {
      expr = item.result;
      justEvaluated = true;
      render();
      resultLine.textContent = item.result;
      historyPanel.classList.remove('open');
    });
    historyList.appendChild(li);
  });
}

document.getElementById('historyToggle').addEventListener('click', () => {
  historyPanel.classList.toggle('open');
});

document.getElementById('clearHistory').addEventListener('click', () => {
  history = [];
  renderHistory();
});

/* ---------- Memory ---------- */

function updateMemoryIndicator() {
  memoryIndicator.classList.toggle('active', memoryValue !== 0);
}

document.querySelectorAll('[data-mem]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.mem;
    if (action === 'MC') { memoryValue = 0; }
    else if (action === 'MR') { insertText(formatNumber(memoryValue)); }
    else {
      try {
        const current = expr ? evaluateExpression(expr, isDeg) : 0;
        memoryValue += action === 'M+' ? current : -current;
      } catch (e) { /* ignore invalid expr */ }
    }
    updateMemoryIndicator();
  });
});

/* ---------- Button wiring ---------- */

document.querySelectorAll('[data-digit]').forEach((btn) => {
  btn.addEventListener('click', () => insertText(btn.dataset.digit));
});

document.querySelectorAll('[data-insert]').forEach((btn) => {
  btn.addEventListener('click', () => insertText(btn.dataset.insert));
});

document.querySelectorAll('[data-append]').forEach((btn) => {
  btn.addEventListener('click', () => appendAfterCurrent(btn.dataset.append));
});

document.getElementById('allClear').addEventListener('click', clearAll);
document.getElementById('backspace').addEventListener('click', backspace);
document.getElementById('toggleSign').addEventListener('click', toggleSign);
document.getElementById('equals').addEventListener('click', equals);

/* ---------- Scientific mode toggle ---------- */

sciToggle.addEventListener('click', () => {
  const open = sciRow.classList.toggle('open');
  sciToggle.textContent = open ? 'Basic mode' : 'Scientific mode';
});

/* ---------- Degree / Radian toggle ---------- */

degToggle.addEventListener('click', () => {
  isDeg = !isDeg;
  degToggle.textContent = isDeg ? 'DEG' : 'RAD';
  render();
});

/* ---------- Theme toggle ---------- */

themeToggle.addEventListener('click', () => {
  const isLight = document.body.getAttribute('data-theme') === 'light';
  document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
  themeToggle.textContent = isLight ? '🌙' : '☀️';
});

/* ---------- Copy result ---------- */

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = resultLine.textContent;
  navigator.clipboard?.writeText(text).then(() => showToast('Copied ' + text));
});

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1400);
}

/* ---------- Keyboard support ---------- */

document.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') { insertText(e.key); return; }
  if (e.key === '.') { insertText('.'); return; }
  if (e.key === '+') { insertText('+'); return; }
  if (e.key === '-') { insertText('−'); return; }
  if (e.key === '*') { insertText('×'); return; }
  if (e.key === '/') { e.preventDefault(); insertText('÷'); return; }
  if (e.key === '^') { insertText('^'); return; }
  if (e.key === '(' || e.key === ')') { insertText(e.key); return; }
  if (e.key === '%') { appendAfterCurrent('%'); return; }
  if (e.key === '!') { appendAfterCurrent('!'); return; }
  if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); return; }
  if (e.key === 'Backspace') { backspace(); return; }
  if (e.key === 'Escape') { clearAll(); return; }
});

render();
updateMemoryIndicator();

</script>
</body>
</html>
